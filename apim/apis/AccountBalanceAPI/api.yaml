type: api
version: v4.4.0
data:
  name: AccountBalanceAPI
  version: 1.0.0
  context: /accounts
  transport:
    - http
    - https
  visibility: PUBLIC

  # ── Security: OAuth2 (Client Credentials) ────────────────────────────────
  # Account balance data is financial PII; OAuth2 ensures every caller has a
  # registered client identity and only the read:accounts scope is permitted.
  securityScheme:
    - oauth2

  # ── Throttling tier: Gold (500 req/min) ──────────────────────────────────
  # Balance queries are frequent, low-latency reads driven by authenticated
  # banking clients polling on behalf of users. Gold allows adequate throughput
  # while still protecting the MI/DB layer from runaway callers.
  apiThrottlingPolicy: Gold

  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://mi:8290/accounts
    sandbox_endpoints:
      url: http://mi:8290/accounts

  # ── API-level gateway policy: inject traceability headers ────────────────
  # Applies JamiiHeaderInject on every request/response regardless of operation.
  apiPolicies:
    request:
      - policyName: JamiiHeaderInject
        policyVersion: v1
        parameters:
          headerName: X-Jamii-Validated
          headerValue: "true"
    response:
      - policyName: JamiiHeaderInject
        policyVersion: v1
        parameters:
          headerName: X-Powered-By
          headerValue: Jamii-APIM-Gateway

  operations:
    - target: /{accountNumber}/balance
      verb: GET
      authType: Application & Application User
      throttlingPolicy: Gold
      scopes:
        - read:accounts
