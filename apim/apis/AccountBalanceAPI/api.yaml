type: api
version: v4.4.0
data:
  name: AccountBalanceAPI
  version: 1.0.0
  context: /accounts
  transport:
    - http
    - https
  visibility: PUBLIC

  securityScheme:
    - oauth2
  apiThrottlingPolicy: Gold

  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://mi:8290/accounts
    sandbox_endpoints:
      url: http://mi:8290/accounts

  apiPolicies:
    request:
      - policyName: JamiiHeaderInject
        policyVersion: v1
        parameters:
          headerName: X-Jamii-Validated
          headerValue: "true"
    response:
      - policyName: JamiiHeaderInject
        policyVersion: v1
        parameters:
          headerName: X-Powered-By
          headerValue: Jamii-APIM-Gateway

  operations:
    - target: /{accountNumber}/balance
      verb: GET
      authType: Application & Application User
      throttlingPolicy: Gold
      scopes:
        - read:accounts
