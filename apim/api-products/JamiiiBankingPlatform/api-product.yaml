type: api-product
version: v4.4.0
data:
  name: JamiiiBankingPlatform
  version: v1
  context: /jamii/v1
  description: >
    Unified API Product bundling all three Jamii savings-platform APIs.
    A single subscription to this product grants access to account balances,
    customer lookup, and loan eligibility — eliminating the need for consuming
    applications to subscribe to each API independently.

  visibility: PUBLIC
  state: PUBLISHED

  # Subscribers get access to all three APIs under one application subscription.
  # The per-API throttling tiers (Gold / Bronze / Silver) still apply per route;
  # this product-level tier caps total product usage across all included APIs.
  apiThrottlingPolicy: Unlimited

  # ── Included APIs and their exposed operations ────────────────────────────
  apis:
    - name: AccountBalanceAPI
      version: 1.0.0
      operations:
        - target: /{accountNumber}/balance
          verb: GET

    - name: CustomerProxyAPI
      version: 1.0.0
      operations:
        - target: /{customerId}
          verb: GET

    - name: LoanEligibilityAPI
      version: 1.0.0
      operations:
        - target: /eligibility
          verb: POST

  # ── Subscription availability ─────────────────────────────────────────────
  subscriptionAvailability: CURRENT_TENANT

  # ── Business information (surfaces in Developer Portal) ───────────────────
  businessInformation:
    businessOwner: Jamii Engineering
    businessOwnerEmail: engineering@jamii.example.com
    technicalOwner: Jamii Platform Team
    technicalOwnerEmail: platform@jamii.example.com

  additionalProperties:
    - name: "platform"
      value: "jamii-savings"
      display: true
    - name: "compliance"
      value: "CBK-regulated"
      display: true
